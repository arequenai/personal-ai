name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      # Solo `check`, no `format --check`: el árbol actual no está formateado con
      # ruff y reformatearlo aquí chocaría con las PRs en vuelo. Se puede añadir
      # en un commit de formato aparte, cuando no haya ramas abiertas.
      - name: Lint
        run: ruff check .

      - name: Tests
        # MCP_SECRET no tiene default: Settings lo exige al importar.
        # Es un valor de test, no un secreto real.
        env:
          MCP_SECRET: ci-test-secret
        run: pytest -q
